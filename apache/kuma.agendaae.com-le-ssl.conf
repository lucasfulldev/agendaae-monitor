<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName kuma.agendaae.com

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/monitor.agendaae.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.agendaae.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    Alias /sso /var/www/html/kuma-sso
    <Directory /var/www/html/kuma-sso>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ProxyPass /sso !
    RewriteEngine On
    RewriteRule ^/sso - [L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3005/$1 [P,L]
    ProxyPass / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    # Remover frame block do Kuma (depois do proxy)
    Header unset X-Frame-Options
    Header always unset X-Frame-Options
    Header edit* X-Frame-Options ^.*$ ""
    Header always set Content-Security-Policy "frame-ancestors https://monitor.agendaae.com 'self'"
</VirtualHost>
</IfModule>
