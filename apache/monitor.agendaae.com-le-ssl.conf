<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName monitor.agendaae.com
    DocumentRoot /var/www/html/monitor.agendaae.com

    ErrorLog ${APACHE_LOG_DIR}/monitor-error.log
    CustomLog ${APACHE_LOG_DIR}/monitor-access.log combined

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/monitor.agendaae.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monitor.agendaae.com/privkey.pem

    <Directory /var/www/html/monitor.agendaae.com>
        AuthType Basic
        AuthName "AgendaAE Monitor"
        AuthUserFile /etc/apache2/monitor.htpasswd
        Require valid-user
        Options -Indexes
        AllowOverride All
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    <Location /api/>
        AuthType Basic
        AuthName "AgendaAE Monitor"
        AuthUserFile /etc/apache2/monitor.htpasswd
        Require valid-user
    </Location>
    ProxyPass /api/ http://127.0.0.1:19999/api/
    ProxyPassReverse /api/ http://127.0.0.1:19999/api/
</VirtualHost>
</IfModule>
